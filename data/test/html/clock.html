<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Canvas圆盘时钟</title>
<style>
body{background:#111;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}
canvas{border:2px solid #333;border-radius:8px;}
</style>
</head>
<body>
<canvas id="clock" width="400" height="400"></canvas>
<script>
const canvas = document.getElementById('clock');
const ctx = canvas.getContext('2d');
const w = canvas.width;
const h = canvas.height;
const r = w / 2 - 20; // 时钟半径

function drawClock() {
  // 清空画布
  ctx.clearRect(0,0,w,h);
  const now = new Date();
  let hh = now.getHours();
  let mm = now.getMinutes();
  let ss = now.getSeconds();

  // 1. 绘制外圆盘
  ctx.beginPath();
  ctx.arc(w/2, h/2, r, 0, Math.PI*2);
  ctx.fillStyle = "#1a1a2e";
  ctx.fill();
  ctx.strokeStyle="#4488ff";
  ctx.lineWidth=4;
  ctx.stroke();

  // 2. 绘制小时数字 1~12
  ctx.fillStyle="#fff";
  ctx.font="24px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  for(let i=1;i<=12;i++){
    const angle = i * Math.PI / 6 - Math.PI/2;
    const x = w/2 + Math.cos(angle)*(r-30);
    const y = h/2 + Math.sin(angle)*(r-30);
    ctx.fillText(i.toString(), x, y);
  }

  // 3. 刻度线
  for(let i=0;i<60;i++){
    const angle = i * Math.PI /30 - Math.PI/2;
    const x1 = w/2 + Math.cos(angle)*r;
    const y1 = h/2 + Math.sin(angle)*r;
    let len;
    if(i%5===0){
      // 小时长刻度
      len=15;
      ctx.strokeStyle="#88aaff";
      ctx.lineWidth=3;
    }else{
      // 秒短刻度
      len=8;
      ctx.strokeStyle="#666";
      ctx.lineWidth=1;
    }
    const x2 = w/2 + Math.cos(angle)*(r-len);
    const y2 = h/2 + Math.sin(angle)*(r-len);
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
  }

  // 角度计算
  const secAngle = ss * Math.PI /30;
  const minAngle = mm * Math.PI /30 + ss * Math.PI/(30*60);
  const hourAngle = (hh%12)*Math.PI/6 + mm*Math.PI/(6*60);

  // 秒针 红色
  drawHand(w/2,h/2, secAngle, r-40, 2, "#ff4444");
  // 分针 浅蓝
  drawHand(w/2,h/2, minAngle, r-60, 4, "#88ccff");
  // 时针 白色粗
  drawHand(w/2,h/2, hourAngle, r-80, 6, "#ffffff");

  // 中心圆点
  ctx.beginPath();
  ctx.arc(w/2,h/2,8,0,Math.PI*2);
  ctx.fillStyle="#fff";
  ctx.fill();

  // 中心大数字时间
  ctx.font="32px monospace";
  ctx.fillStyle="#99ffaa";
  const timeStr = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  ctx.fillText(timeStr, w/2, h/2 + 110);
}

// 绘制指针函数
function drawHand(cx, cy, angle, length, width, color){
  ctx.save();
  ctx.beginPath();
  ctx.translate(cx,cy);
  ctx.rotate(angle - Math.PI/2);
  ctx.moveTo(0,0);
  ctx.lineTo(0, -length);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap="round";
  ctx.stroke();
  ctx.restore();
}

// 循环刷新
drawClock();
setInterval(drawClock, 1000);

/* Nav-cleanup test loop: after a few visible ticks, hop back to navtest.html.
 * The scripted navigation runs the full engine-side termination cleanup
 * (abort this page, drop pending work, free this document + VM) each cycle. */
setTimeout(function() { location.href = "navtest.html"; }, 6000);
</script>
</body>
</html>
